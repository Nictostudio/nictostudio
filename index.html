<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href='estils/estils.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Amarante">

</head>
<body>

<header>
<div class=headerlogo>
</div>
</header>

<main>

    <div class="ficha-cuadro">

        <div class="imagen-cuadro">
            <img src="imatges/cuadrelogo.png" alt="Nicto Studio">
        </div>


        <div class="placa-museo">

            <span class="tornillo tl"></span>
            <span class="tornillo tr"></span>
            <span class="tornillo bl"></span>
            <span class="tornillo br"></span>

            <h2>Esto es</h2>

            <img src="imatges/logo01.png" alt="Escudo" class="placa-logo">

            <div class="subtitulo1">
                Retratos personalizados.
            </div>

            <div class="subtitulo2">
                ¡Inmortaliza a tu mascota en madera o lienzo!
            </div>

           
        </div>

    </div>
<section class="seccion-galeria">

    <div class="titulo-galeria">

        <span class="tornillo-galeria izq"></span>
        <span class="tornillo-galeria der"></span>

        <h1>Obras Destacadas</h1>

    </div>


<div class="gallerywrap">

  <div class="gallery" role="list">

  
    <button class="thumb" type="button"
          data-thumb="../imatges/marc01v1.png"

    </button>

  
    <button class="thumb" type="button"

          data-index="1">
    <img src="imatges/marc02v1.png" alt="Imagen 2">
    </button>

  
    <button class="thumb" type="button"
          data-thumb="imatges/marc03v1.png"
          data-full="imatges/imatge03v1.jpg"
          data-alt="Imagen 3"
          data-index="2">
    <img src="imatges/marc03v1.png" alt="Imagen 3">
    </button>

  
    <button class="thumb" type="button"
          data-thumb="imatges/marc04v1.png"
          data-full="imatges/imatge04v1.jpg"
          data-alt="Imagen 4"
          data-index="3">
    <img src="imatges/marc04v1.png" alt="Imagen 2">
  
    </button>
              
  
    <button class="thumb" type="button"
          data-thumb="imatges/marc05v1.png"

    <img src="imatges/marc05v1.png" alt="Imagen 5">
    </button>

  
    <button class="thumb" type="button"
          data-thumb="imatges/marc06v1.png"
          data-full="imatges/imatge06v1.jpg"

          data-index="5">
    <img src="imatges/marc06v1.png" alt="Imagen 6">
  
    </button>
             
    <button class="thumb" type="button"
          data-thumb="imatges/marc07v1.png"
          data-full="imatges/imatge07v1.jpg"

          data-index="6">
    <img src="imatges/marc07v1.png" alt="Imagen 7">

    <button class="thumb" type="button"

      </div>
      </div>
    </div>
</section>

<section class="seccion-galeria seccion-contacto" id="contacto">
  <div class="titulo-galeria">
    <span class="tornillo-galeria izq"></span>
    <span class="tornillo-galeria der"></span>
    <h1>Contacto</h1>
  </div>

  <div class="contacto-wrap">
    <div class="contacto-placas">

      <div class="placa-museo contacto-info">
                <span class="tornillo tl"></span>
        <span class="tornillo tr"></span>
        <span class="tornillo bl"></span>
        <span class="tornillo br"></span>
        <h2>Escríbenos</h2>

         <div class="subtitulo2">
          ¡Cuéntanos qué necesitas y te asesoramos!
        </div>

        <div class="contacto-datos">
          <div class="contacto-dato">
            <div class="contacto-dato__k">Email</div>
            <div class="contacto-dato__v">nictostudioart@proton.me</div>
          </div>
          <div class="contacto-dato">
            
            <a class="contacto-instagram" href="https://instagram.com/nicto.studio.art" target="_blank" rel="noopener noreferrer">
              <img class="ig-img" src="imatges/logoinsta.png" alt="Instagram">
            </a>
          </div>
        </div>
      </div>

      <form class="placa-museo contacto-form" action="#" method="post">
        <span class="tornillo tl"></span>
        <span class="tornillo tr"></span>
        <span class="tornillo bl"></span>
        <span class="tornillo br"></span>

        <h2>Formulario</h2>
<form action="https://formsubmit.co/nictostudioart@proton.me" method="POST" >
        <label class="campo">
          <span class="campo__label">Nombre</span>
          <input class="campo__input" type="text" name="nombre" autocomplete="name" required>
        </label>

        <label class="campo">
          <span class="campo__label">Email</span>
          <input class="campo__input" type="email" name="email" autocomplete="email" required>
        </label>

        <label class="campo">
          <span class="campo__label">Asunto</span>
          <input class="campo__input" type="text" name="asunto" required>
        </label>

        <label class="campo">
          <span class="campo__label">Mensaje</span>
          <textarea class="campo__input campo__textarea" name="mensaje" rows="5" required></textarea>
        </label>

        <button class="contacto-btn" type="submit">Enviar</button>
        <p class="contacto-nota">Te responderemos por email lo antes posible.</p>
      </form>
    </form>

    </div>
  </div>
</section>
</main>


<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__content" role="dialog" aria-modal="true" aria-label="Vista de imagen">
    <button class="modal__close" id="modalClose" type="button" aria-label="Cerrar">✕</button>

    <button class="modal__nav modal__nav--prev" id="btnPrev" type="button" aria-label="Anterior">‹</button>
    <button class="modal__nav modal__nav--next" id="btnNext" type="button" aria-label="Siguiente">›</button>

    <img class="modal__img" id="modalImg" src="" alt="" />
  </div>
</div>




<footer>
<p>© Nicto Studio 2026</p>

</footer>
<script src="java/app.js"></script>
</body>
</html>
